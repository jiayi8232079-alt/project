# Minimal SDK dependency manifest for scripts/prepare_param.sh (toolchain version lookup).
# Aligns with build_app.sh defaults: TARGET_PLATFORM=T5, version 0.0.75.
dependencies:
  toolchains:
    -
      name: T5
      version: 0.0.75
      locater: vendor
  components:
    -
      Component:
        name: tuyaos_jiajia
        locater: apps
